<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульс Офис</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%2314171c%27%2F%3E%3Cpath%20d%3D%27M4%2017h5l3-7%204%2013%203-9%202%203h7%27%20stroke%3D%27%23fff%27%20stroke-width%3D%272%27%20fill%3D%27none%27%20stroke-linejoin%3D%27round%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  --paper:#ffffff; --chrome:#f7f8f9; --chrome-2:#eceef1;
  --line:#dcdfe4; --line-soft:#e9ebef;
  --ink:#14171c; --muted:#6d7480;
  --accent:#2b5fd9;
  --violet:#7c3aed;
  --rail:6px; --nav:238px;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);color:var(--ink);background:var(--chrome);overflow:hidden;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:40;
  border:0;padding:0;background:var(--line);cursor:pointer;overflow:hidden}
#rail:hover{background:var(--chrome-2)}
#rail::after{content:'';position:absolute;left:0;right:0;top:0;height:0;background:var(--accent)}
#rail.filling::after{animation:fill 1500ms linear forwards}
@keyframes fill{from{height:0}to{height:100%}}
#rail .grip{position:absolute;left:1px;top:50%;transform:translateY(-50%);
  width:4px;height:44px;border-radius:2px;background:var(--muted);opacity:.35}
#rail:hover .grip{opacity:.7}
body.pinned #rail{display:none}

#app-tab{position:fixed;left:0;top:104px;z-index:45;width:16px;height:46px;padding:0;
  border:1px solid var(--line);border-left:0;border-radius:0 9px 9px 0;background:var(--paper);
  box-shadow:1px 1px 5px rgba(0,0,0,.14);cursor:pointer;touch-action:none;
  display:flex;align-items:center;justify-content:center;transition:width .12s ease, opacity .15s ease}
#app-tab span{width:6px;height:18px;border-left:2px solid var(--muted);border-right:2px solid var(--muted);opacity:.55}
#app-tab:hover{width:20px}
#app-tab:hover span{opacity:.85}
#app-tab.dragging{cursor:grabbing;width:20px;box-shadow:2px 2px 9px rgba(0,0,0,.22)}
body.pinned #app-tab,body.nav-open #app-tab{opacity:0;pointer-events:none}
@media (pointer:coarse){ #app-tab{width:24px;height:58px} #app-tab span{height:24px} }

#nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav);z-index:50;
  background:var(--paper);border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .18s ease;
  display:flex;flex-direction:column;padding:14px 12px}
#nav.open,body.pinned #nav{transform:none}
#nav header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  margin-bottom:16px}
#nav .mark{font-size:14px;font-weight:650;letter-spacing:-.015em;line-height:1.25}
#nav .mark small{display:block;font-size:10px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-top:3px}
#pin{border:1px solid var(--line);background:var(--chrome);border-radius:6px;
  width:26px;height:26px;cursor:pointer;color:var(--muted);flex:0 0 auto;line-height:1}
#pin[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#nav
.mark{padding:3px 0 0 2px}
.лого-старт{margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:0 6px 6px}
#nav nav{display:flex;flex-direction:column;gap:2px}
#nav nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;
  background:transparent;text-align:left;padding:8px 9px;border-radius:7px;cursor:pointer;
  font-size:13px}
#nav nav button:hover{background:var(--chrome)}
#nav nav button[aria-current="true"]{background:var(--chrome-2);font-weight:600}
#nav nav button i{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center}
#nav .spacer{flex:1}
#nav .foot{font-size:11px;color:var(--muted);line-height:1.5;padding:0 6px}
#nav .foot kbd{font-family:var(--mono);font-size:10.5px;background:var(--chrome-2);
  border:1px solid var(--line);border-radius:4px;padding:0 4px}

#veil{position:fixed;inset:0;z-index:45;display:none;background:rgba(20,23,28,.14)}
#veil.on{display:block}

#stage{position:absolute;inset:0;transition:left .18s ease}
body.pinned #stage{left:var(--nav)}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;
  background:var(--paper)}
#stage iframe.on{display:block}

#home{position:absolute;inset:0;overflow:auto;display:none;background:var(--paper)}
#home.on{display:block}
.wrap{max-width:840px;margin:0 auto;padding:104px 32px 56px}
.лого-старт{margin-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);margin:0 0 26px;font-weight:500}
h1{font-size:34px;line-height:1.15;letter-spacing:-.025em;font-weight:680;margin:0 0 12px}
.lede{font-size:15px;line-height:1.6;color:var(--muted);margin:0 0 34px;max-width:52ch}
.cards{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px}
.card{display:block;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:22px 22px 20px;cursor:pointer;
  transition:border-color .14s ease, transform .14s ease}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card .glyph{margin-bottom:14px}
.card h2{font-size:16px;font-weight:640;letter-spacing:-.01em;margin:0 0 5px}
.card p{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0}
.card .formats{font-family:var(--mono);font-size:10.5px;color:var(--muted);
  border-top:1px solid var(--line-soft);padding-top:9px;line-height:1.7}
.card .formats b{color:var(--ink);font-weight:500}
.hint{margin-top:26px;font-size:12px;color:var(--muted)}

#недавние{margin-top:30px}
#недавние[hidden]{display:none}
#недавние h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px}
.нед-список{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.нед{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;
  transition:border-color .14s ease,transform .14s ease}
.нед:hover{border-color:var(--ink);transform:translateY(-1px)}
.нед .вид{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  font:600 10px var(--mono);color:#fff;background:#2b5fd9;letter-spacing:.02em}
.нед .имя{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.нед .когда{flex:none;font-size:11px;color:var(--muted)}
.нед .откуда{flex:none;font-size:11px;color:var(--muted)}
#недЧисто{margin-top:10px;font-size:11.5px;color:var(--muted);background:none;border:0;
  cursor:pointer;padding:0;text-decoration:underline}
#недСлово{font-size:11.5px;color:var(--muted);margin:8px 0 0}

#просьба{display:flex;align-items:center;gap:10px;margin:0 0 22px;padding:11px 14px;
  border:1px solid #f0c36d;background:#fdf6e3;border-radius:10px;font-size:13px}
#просьба[hidden]{display:none}
#просьба .текст{flex:1;min-width:0}
#просьба button{font:inherit;font-size:12px;padding:5px 11px;border:1px solid var(--line);
  background:var(--paper);border-radius:7px;cursor:pointer}
#просьба button:hover{border-color:var(--ink)}
#просьбаЗакрыть{border:0;background:none;font-size:17px;line-height:1;color:var(--muted);padding:0 3px}

#бросок{position:fixed;inset:0;z-index:60;pointer-events:none;background:rgba(41,109,244,.08);
  border:3px dashed #296DF4;display:flex;align-items:center;justify-content:center;
  font:600 18px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1b4f9c}
#бросок span{background:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:720px){
  .wrap{padding:48px 20px 40px}
  h1{font-size:27px}
  .cards{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  #rail.filling::after{animation:none;height:100%}
  #nav,#stage,.card{transition:none}
}

#поискПоПапке{max-width:760px;margin:0 auto 22px;text-align:left}
.пп-строка{display:flex;gap:8px}
#ппЗапрос{flex:1;height:34px;border:1px solid #d7dde8;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;background:#fff;color:#14171c}
#ппЗапрос:focus{outline:2px solid #2b5fd9;outline-offset:-1px}
.пп-строка button{height:34px;padding:0 14px;border:1px solid #d7dde8;border-radius:8px;background:#fff;cursor:pointer;font:inherit;font-size:13px}
.пп-строка button:hover{background:#f4f7fb}
.пп-состояние{font-size:12px;color:#6d7480;margin:6px 2px 0;min-height:16px}
#ппНаходки{margin-top:8px;max-height:320px;overflow:auto}
#ппНаходки .нах{display:block;width:100%;text-align:left;border:1px solid #e6eaf1;border-radius:8px;background:#fff;
  padding:8px 10px;margin-bottom:6px;cursor:pointer;font:inherit}
#ппНаходки .нах:hover{border-color:#2b5fd9;background:#f7f9fd}
#ппНаходки .имя{font-size:13px;color:#14171c;font-weight:500}
#ппНаходки .путь{font-size:11px;color:#8b93a1;margin-left:6px}
#ппНаходки .кусок{font-size:12px;color:#4b5563;margin-top:2px;display:block}
#ппНаходки .кусок b{background:#fff3bf;font-weight:600}
</style>
</head>
<body>

<button id="rail" title="Задержите курсор или нажмите — выедет панель разделов"
        aria-label="Открыть панель разделов"><span class="grip"></span></button>
<button id="app-tab" title="Разделы: нажмите или потяните вправо. Потяните вверх или вниз — передвинуть ярлычок"
        aria-label="Открыть панель разделов"><span></span></button>
<div id="veil"></div>

<aside id="nav" aria-label="Разделы">
  <header>
    <div class="mark"><svg class="лого" viewBox="0 0 167 22" height="18" role="img" aria-label="Пульс Офис"><rect x="1" y="1" width="20" height="20" rx="6" fill="none" stroke="#2f6fed" stroke-width="2"/>
  <circle cx="5.2" cy="12.6" r="1.5" fill="#ef4444"/>
  <path d="M7 12.6h2.1l1.4-4.6 2 9 1.6-6.6 1.4 2.2h1.1"
    fill="none" stroke="#2f6fed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15.6" y="10.4" width="1.7" height="5.6" rx=".8" fill="#22c55e"/>
  <rect x="18.1" y="8.2" width="1.7" height="7.8" rx=".8" fill="#22c55e"/><text x="27" y="16" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" letter-spacing=".6"><tspan font-weight="800" fill="#1b4f9c">ПУЛЬС</tspan><tspan font-weight="500" fill="#5a7099" dx="5">ОФИС</tspan></text></svg></div>
    <button id="pin" aria-pressed="false" title="Закрепить панель">⊟</button>
  </header>
  <div class="eyebrow">Разделы</div>
  <nav>
    <button data-go="home" aria-current="true"><i>⌂</i>Главная</button>
    <button data-go="text"><i>¶</i>Пульс Документы</button>
    <button data-go="sheets"><i>▦</i>Пульс Таблицы</button>
    <button data-go="slides"><i>▭</i>Пульс Презентации</button>
    <button data-go="projects"><i>▤</i>Пульс Проекты</button>
    <button data-go="diagrams"><i>◇</i>Пульс Диаграммы</button>
  </nav>
  <div class="spacer"></div>
  <div class="foot">Разделы работают рядом: переключение не теряет открытые книги
    и схемы.<br><br>Панель: задержите курсор у левого края или нажмите <kbd>Esc</kbd>.</div>
</aside>

<div id="stage">
  <div id="home" class="on">
    <div class="wrap">
      <div class="лого-старт"><svg viewBox="0 0 300 58" height="52" role="img" aria-label="Пульс Офис">
  <g transform="translate(0,7) scale(1.85)"><rect x="1" y="1" width="20" height="20" rx="6" fill="none" stroke="#2f6fed" stroke-width="2"/>
  <circle cx="5.2" cy="12.6" r="1.5" fill="#ef4444"/>
  <path d="M7 12.6h2.1l1.4-4.6 2 9 1.6-6.6 1.4 2.2h1.1"
    fill="none" stroke="#2f6fed" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15.6" y="10.4" width="1.7" height="5.6" rx=".8" fill="#22c55e"/>
  <rect x="18.1" y="8.2" width="1.7" height="7.8" rx=".8" fill="#22c55e"/></g>
  <text x="56" y="38" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="30" letter-spacing="1.4">
    <tspan font-weight="800" fill="#1b4f9c">ПУЛЬС</tspan>
    <tspan font-weight="500" fill="#5a7099" dx="10">ОФИС</tspan>
  </text></svg></div>

      <div id="поискПоПапке">
        <div class="пп-строка">
          <input type="search" id="ппЗапрос" placeholder="найти во всех документах папки" autocomplete="off">
          <button id="ппПапка" title="Выбрать папку с документами">Папка…</button>
          <button id="ппОбновить" title="Пересмотреть изменившиеся файлы" hidden>Обновить</button>
        </div>
        <div class="пп-состояние" id="ппСостояние"></div>
        <div id="ппНаходки"></div>
      </div>

      <div class="cards">
        <button class="card" data-go="text">
          <svg class="glyph" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="32" height="32" rx="4" stroke="#2b5fd9" stroke-width="1.6"/>
            <path d="M8 10h18M8 16h18M8 22h11" stroke="#2b5fd9" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <h2>Пульс Документы</h2>
          <p>Документы: оформление, таблицы с формулами, картинки, подписи.</p>
        </button>

        <button class="card" data-go="sheets">
          <svg class="glyph" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="32" height="32" rx="4" stroke="#2b5fd9" stroke-width="1.6"/>
            <path d="M1 11h32M1 22h32M12 1v32M23 1v32" stroke="#2b5fd9" stroke-width="1.2" opacity=".45"/>
            <rect x="12" y="11" width="11" height="11" fill="#2b5fd9" opacity=".16"/>
          </svg>
          <h2>Пульс Таблицы</h2>
          <p>Электронные таблицы: расчёты, сводки, разбор данных.</p>
        </button>

        <button class="card" data-go="slides">
          <svg class="glyph" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="2" y="5" width="30" height="20" rx="3" stroke="#2b5fd9" stroke-width="1.6"/>
            <path d="M17 25v5M12 30h10" stroke="#2b5fd9" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M7 19l5-5 4 4 6-7" stroke="#2b5fd9" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <h2>Пульс Презентации</h2>
          <p>Слайды: шаблоны, картинки, таблицы, показ, вывод в .pptx.</p>
        </button>

        <button class="card" data-go="projects">
          <svg class="glyph" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="1" y="5" width="14" height="6" rx="2" fill="#0a7d3f" opacity=".18" stroke="#0a7d3f" stroke-width="1.4"/>
            <rect x="8" y="14" width="17" height="6" rx="2" fill="#0a7d3f" opacity=".18" stroke="#0a7d3f" stroke-width="1.4"/>
            <rect x="17" y="23" width="12" height="6" rx="2" fill="#0a7d3f" opacity=".18" stroke="#0a7d3f" stroke-width="1.4"/>
            <path d="M15 8h2v6M25 17h2v6" stroke="#0a7d3f" stroke-width="1.3" opacity=".6"/>
          </svg>
          <h2>Пульс Проекты</h2>
          <p>Планы и сроки: задачи, зависимости, диаграмма Ганта.</p>
        </button>

        <button class="card" data-go="diagrams">
          <svg class="glyph" width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="1" y="3" width="12" height="9" rx="2" stroke="#7c3aed" stroke-width="1.6"/>
            <rect x="21" y="3" width="12" height="9" rx="2" stroke="#7c3aed" stroke-width="1.6"/>
            <rect x="11" y="22" width="12" height="9" rx="2" stroke="#7c3aed" stroke-width="1.6"/>
            <path d="M13 7.5h8M7 12v6h10v4M27 12v6H17v4" stroke="#7c3aed" stroke-width="1.4"
                  opacity=".6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2>Пульс Диаграммы</h2>
          <p>Схемы и блок-схемы: процессы, инфраструктура, связи.</p>
        </button>
      </div>

      <div id="недавние" hidden>
        <h3>Недавние</h3>
        <div class="нед-список" id="недСписок"></div>
        <p id="недСлово"></p>
        <button id="недЧисто">Очистить список</button>
      </div>

      <p class="hint">Разделы — на панели слева. Задержите там курсор или нажмите на полосу.
        Файл можно просто перетащить в окно.</p>
    </div>
